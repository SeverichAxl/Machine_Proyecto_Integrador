seed: 42
paths: {raw: data/raw/ml-25m, processed: data/processed, models: models, results: reports/results, figures: reports/figures}
subset:
  min_ratings_user: 20
  min_ratings_movie: 50
  n_users: 2000          # usuarios completos muestreados (ajustar con el EDA y la RAM)
  min_ratings_movie_after_sample: 10
split: {train: 0.70, val: 0.15}   # test = resto; temporal por usuario
oof_folds: 5
ranking: {k: 10, n_neg: 99, relevant_threshold: 4.0, max_users: 2000}
models:
  damping: [5, 10, 25]
  knn: {k: [20, 50], shrink: [10, 50]}
  svd: {n_factors: [20, 50], lr: [0.005], reg: [0.02, 0.05], epochs: 24}
  ridge: {alpha: [1, 10, 100]}
  hgb: {max_depth: [4, 6], learning_rate: [0.05, 0.1], max_iter: 300}
features: {damping: 10, genre_k: 5}
automl: {time_budget: 600, estimator_list: [lgbm, xgboost, rf, extra_tree]}
clustering: {pca_components: 30, k_min: 3, k_max: 12, n_seeds: 5, silhouette_sample: 5000, k_final: null}
